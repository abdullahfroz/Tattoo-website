<!DOCTYPE html>
<html lang="en">

<head>

</head>


<body>

    <!-- Navigation -->

    <header class="navbar">

        >

<section id="work" class="portfolio">

        </h2>

    <div class="childhood-content">

        </p>

            IT STARTED
            LONG BEFORE
            THE INK.
        </h2>
